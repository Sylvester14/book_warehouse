
services:
  caddy: 
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - symfony_public:/var/www/symfony/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - database
      - symfony
  
  symfony:
    build:
      context: .
      target: symfony_prod
    container_name: book_warehouse_php
    environment:
      DATABASE_URL: "postgresql://app:app_password@database:5432/book_warehouse_db?serverVersion=16&charset=utf8"
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: 7b260b862861a426b364b92d7a727fe8
    volumes:
      - symfony_public:/var/www/symfony/public

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: book_warehouse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_warehouse_db}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-book_warehouse_db}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  symfony_public:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
